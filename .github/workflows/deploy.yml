name: Desplegar API al VPS

# Cada push a main redespliega la API. El frontend va aparte (Vercel).
on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  group: deploy-raicescare-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/raicescare_backend

            echo "== 1. Traer código =="
            git fetch origin main
            git reset --hard origin/main

            echo "== 2. Construir imagen =="
            docker compose build

            echo "== 3. Recrear contenedor (workaround Docker-Snap/AppArmor) =="
            # docker stop falla por AppArmor incluso con sudo: se mata el PID directo.
            # Quitar restart=always ANTES del kill o el contenedor resucita con la
            # imagen vieja. VPS COMPARTIDO: nunca reiniciar el daemon de Docker.
            sudo docker update --restart=no raicescare_api
            POLICY=$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' raicescare_api 2>/dev/null || echo "")
            if [ "$POLICY" != "no" ] && [ -n "$POLICY" ]; then
              echo "ERROR: no se pudo quitar la politica de reinicio (policy=$POLICY); aborto para evitar carrera"
              exit 1
            fi
            PID=$(docker inspect --format '{{.State.Pid}}' raicescare_api 2>/dev/null || echo "")
            if [ -n "$PID" ] && [ "$PID" != "0" ]; then
              sudo kill -9 "$PID" || true
              sleep 2
            fi
            sudo docker rm raicescare_api || true
            sudo docker compose up -d

            echo "== 4. Migraciones pendientes =="
            sleep 5
            docker compose exec -T raicescare_api npx prisma migrate deploy

            echo "== 5. Verificar =="
            docker ps --filter name=raicescare_api --format "  contenedor: up {{.RunningFor}} ({{.Image}})"
            curl -sf http://localhost:8221/api/v1/health && echo "  -> API OK"
